# Runs the whole backend side on one server. The Frontend stays on Vercel;
# Redis (Upstash) and Postgres (Neon) stay hosted. Secrets come from
# deploy/.env on the server, never from the repo.
x-app: &app
  build:
    context: .
  restart: unless-stopped
  env_file: deploy/.env
  environment:
    ONNXRUNTIME_NODE_INSTALL: skip

services:
  # Redis runs on the same server instead of Upstash's free tier, whose monthly
  # bandwidth allowance BullMQ's constant polling can exhaust. Data here is
  # transient (job queue + live-update pub/sub), so no persistence is needed.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]

  backend:
    <<: *app
    build:
      context: .
      args: { APP: Backend }
    depends_on: [redis]
    environment:
      REDIS_URL: redis://redis:6379
      PORT: "3001"
      INTERNAL_BROADCAST_URL: http://websockets:8081/internal/broadcast

  websockets:
    <<: *app
    build:
      context: .
      args: { APP: Websockets }
    depends_on: [redis]
    environment:
      REDIS_URL: redis://redis:6379
      PORT: "8081"

  worker:
    <<: *app
    build:
      context: .
      args: { APP: Worker }
    depends_on: [redis]
    environment:
      REDIS_URL: redis://redis:6379
      INTERNAL_BROADCAST_URL: http://websockets:8081/internal/broadcast
      CONTEXT_STRATEGY: retrieval
      RETRIEVAL: hybrid
      EMBED_MISSING: "true"
    volumes:
      # Repository clones and the embedding model cache survive restarts.
      - worker-cache:/app/apps/Worker/.repo-cache

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    env_file: deploy/.env
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [backend, websockets]

volumes:
  worker-cache:
  caddy-data:
