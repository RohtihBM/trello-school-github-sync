services:
  - type: web
    name: trello-school-backend
    runtime: node
    plan: free
    buildCommand: rm -rf node_modules apps/*/node_modules packages/*/node_modules && npm install --include=optional && npm run generate --workspace=packages/db && npm run build --workspace=apps/Backend
    startCommand: npm run start --workspace=apps/Backend
    envVars:
      # The embedding library is an optional dependency of the Worker, so every
      # service's root install pulls it in. On Linux x64 its install script
      # would otherwise download several hundred MB of CUDA binaries.
      - key: ONNXRUNTIME_NODE_INSTALL
        value: skip
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: INTERNAL_API_SECRET
        sync: false
      # The deployed Websockets service's public URL + /internal/broadcast —
      # see apps/Websockets/src/internal.ts for why this is the public URL
      # now, not a private-network-only port.
      - key: INTERNAL_BROADCAST_URL
        sync: false
      - key: GITHUB_SYNC_BOARD_ID
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      # The deployed Worker service's own URL — pinged (fire-and-forget) on
      # every job enqueue to wake it from Render's free-tier sleep. See
      # apps/Backend/src/lib/queue.ts and apps/Worker/src/index.ts.
      - key: WORKER_WAKE_URL
        sync: false

  - type: web
    name: trello-school-websockets
    runtime: node
    plan: free
    buildCommand: rm -rf node_modules apps/*/node_modules packages/*/node_modules && npm install --include=optional && npm run generate --workspace=packages/db && npm run build --workspace=apps/Websockets
    startCommand: npm run start --workspace=apps/Websockets
    envVars:
      # The embedding library is an optional dependency of the Worker, so every
      # service's root install pulls it in. On Linux x64 its install script
      # would otherwise download several hundred MB of CUDA binaries.
      - key: ONNXRUNTIME_NODE_INSTALL
        value: skip
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: INTERNAL_API_SECRET
        sync: false
      - key: REDIS_URL
        sync: false

  # Not a real Render "Background Worker" (that service type starts at
  # $7/month) — deployed as a free Web Service instead, with a minimal
  # health endpoint added purely to satisfy Render's health check. See
  # apps/Worker/src/index.ts for the full reasoning and the sleep/wake
  # tradeoff this accepts.
  - type: web
    name: trello-school-worker
    runtime: node
    plan: free
    buildCommand: rm -rf node_modules apps/*/node_modules packages/*/node_modules && npm install --include=optional && npm run generate --workspace=packages/db && npm run build --workspace=apps/Worker
    startCommand: npm run start --workspace=apps/Worker
    envVars:
      # The embedding library is an optional dependency of the Worker, so every
      # service's root install pulls it in. On Linux x64 its install script
      # would otherwise download several hundred MB of CUDA binaries.
      - key: ONNXRUNTIME_NODE_INSTALL
        value: skip
      - key: DATABASE_URL
        sync: false
      - key: INTERNAL_API_SECRET
        sync: false
      - key: INTERNAL_BROADCAST_URL
        sync: false
      - key: REDIS_URL
        sync: false
      # Retrieval settings (see apps/Worker/src/processPlanJob.ts). The deployed
      # Worker plans from a bounded slice of the repo chosen by keyword ranking,
      # and never loads the embedding model to index (a 512 MB server cannot
      # hold it next to Claude's own process). The vectors
      # are written to Postgres by the GitHub Action in
      # .github/workflows/index-embeddings.yml. Switch RETRIEVAL to "hybrid"
      # only after checking the Worker's memory on Render with the model loaded
      # (about 340 MB peak on a Mac for the read-only path).
      - key: CONTEXT_STRATEGY
        value: retrieval
      - key: RETRIEVAL
        value: keyword
      - key: EMBED_MISSING
        value: "false"
      # The real, metered API key — this is what makes the deployed Worker
      # actually call Claude, since it has no local Claude Code CLI login
      # to fall back on. Never set this in a LOCAL .env — see the project
      # history on why local dev deliberately stays on the free
      # subscription login instead.
      - key: ANTHROPIC_API_KEY
        sync: false
